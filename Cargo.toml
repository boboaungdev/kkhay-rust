[package]
name = "kkhay"
version = "1.0.0"
edition = "2021"
authors = ["K Khay <dev@kkhay.com>"]
description = "Official Rust SDK for K Khay Sovereign Crypto Payment Gateway"
readme = "README.md"
license = "MIT"
repository = "https://github.com/boboaungdev/kkhay-rust"
homepage = "https://kkhay.com"
keywords = ["crypto", "payments", "gateway", "web3", "usdt"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2.5"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"], optional = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }

